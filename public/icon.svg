<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Gravitational Wave Orbits -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.25" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.45" />

  <!-- Center Glowing Antigravity Core -->
  <circle cx="256" cy="256" r="70" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.85" />
  <circle cx="256" cy="256" r="60" fill="url(#accentGrad)" />

  <!-- Chevron & Slash Symbol -->
  <path d="M210 210 L160 256 L210 302" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M302 210 L352 256 L302 302" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="275" y1="190" x2="237" y2="322" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
</svg>
